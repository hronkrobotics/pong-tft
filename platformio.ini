; Nano clones that use a CH340 USB chip almost always need the old bootloader.
; If upload fails with stk500_getsync, switch to env:nano_new.

[platformio]
src_dir = firmware/Pong

[env:nano_old]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200

[env:nano_new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

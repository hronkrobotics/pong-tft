<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700">
  <rect width="1040" height="700" fill="#f6f3ec"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#1c1915">Pong wiring</text>
  <text x="40" y="72" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">Nano clone and 3.5 inch SPI TFT on the big breadboard. One mini breadboard per player.</text>

  <rect x="250" y="110" width="540" height="360" rx="16" fill="#e7f0e4" stroke="#2f6b3a" stroke-width="2"/>
  <text x="270" y="140" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1915">Big breadboard</text>

  <rect x="280" y="170" width="200" height="250" rx="8" fill="#f7f7f2" stroke="#222" stroke-width="2"/>
  <text x="300" y="198" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1915">3.5" TFT</text>
  <text x="300" y="220" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5c564c">480 x 320 SPI</text>
  <text x="300" y="250" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">VCC   5V</text>
  <text x="300" y="270" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">GND   GND</text>
  <text x="300" y="290" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">LED   3V3</text>
  <text x="300" y="310" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">CS    D10</text>
  <text x="300" y="330" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">RST   D8</text>
  <text x="300" y="350" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">DC    D9</text>
  <text x="300" y="370" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">MOSI  D11</text>
  <text x="300" y="390" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">SCK   D13</text>

  <rect x="560" y="190" width="190" height="210" rx="8" fill="#d9e4f2" stroke="#1d4e89" stroke-width="2"/>
  <text x="580" y="220" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1915">Arduino Nano</text>
  <text x="580" y="244" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5c564c">clone, USB up</text>
  <text x="580" y="276" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D2 D3  left</text>
  <text x="580" y="296" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D4 D5  right</text>
  <text x="580" y="324" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">5V   TFT VCC</text>
  <text x="580" y="344" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">3V3  TFT LED</text>
  <text x="580" y="364" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">GND  common</text>

  <rect x="40" y="180" width="180" height="200" rx="14" fill="#d7f3f6" stroke="#0e7490" stroke-width="2"/>
  <text x="58" y="210" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1915">Left player</text>
  <text x="58" y="232" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#0e7490">cyan paddle</text>
  <rect x="70" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#0e7490"/>
  <rect x="140" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#0e7490"/>
  <text x="84" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Up</text>
  <text x="148" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Down</text>
  <text x="58" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D2</text>
  <text x="148" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D3</text>
  <text x="58" y="352" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c564c">Both buttons to GND</text>

  <rect x="820" y="180" width="180" height="200" rx="14" fill="#fff1d6" stroke="#b45309" stroke-width="2"/>
  <text x="838" y="210" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1915">Right player</text>
  <text x="838" y="232" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#b45309">amber paddle</text>
  <rect x="850" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#b45309"/>
  <rect x="920" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="864" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Up</text>
  <text x="928" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Down</text>
  <text x="838" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D4</text>
  <text x="928" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D5</text>
  <text x="838" y="352" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c564c">Both buttons to GND</text>

  <path d="M220 300 H250" stroke="#0e7490" stroke-width="3" fill="none"/>
  <path d="M790 300 H820" stroke="#b45309" stroke-width="3" fill="none"/>

  <rect x="40" y="520" width="960" height="140" rx="14" fill="#fff" stroke="#d6d0c6"/>
  <text x="64" y="552" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1915">Signal level on CS, RESET, DC, MOSI, and SCK</text>
  <text x="64" y="582" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">Nano ----[ 470 ohm ]----+---- TFT pin</text>
  <text x="268" y="606" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">|</text>
  <text x="268" y="630" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">[ 1k ohm ]</text>
  <text x="268" y="648" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">GND</text>
  <text x="520" y="600" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">VCC stays on 5V. LED stays on 3V3.</text>
  <text x="520" y="624" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">MISO stays unconnected. Tie T_CS to 3V3</text>
  <text x="520" y="648" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">if the module has a touch header.</text>
</svg>

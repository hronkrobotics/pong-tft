<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760">
  <rect width="1040" height="760" fill="#f6f3ec"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#1c1915">Pong wiring</text>
  <text x="40" y="72" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">1 middle: screen and Nano.  2 left: bottom player.  3 right: top player.  4 bottom: two resistors, 5 V down to 3.3 V.</text>

  <rect x="250" y="100" width="540" height="400" rx="16" fill="#e7f0e4" stroke="#2f6b3a" stroke-width="2"/>
  <text x="270" y="128" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1915">1  Big breadboard</text>

  <rect x="280" y="150" width="210" height="320" rx="8" fill="#f7f7f2" stroke="#222" stroke-width="2"/>
  <text x="298" y="176" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1915">3.5" TFT</text>
  <text x="298" y="196" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5c564c">320 x 480 portrait</text>
  <text x="298" y="224" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">VCC    5V</text>
  <text x="298" y="244" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">GND    GND</text>
  <text x="298" y="264" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">LED    3V3</text>
  <text x="298" y="284" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">CS     D10</text>
  <text x="298" y="304" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">RST    D8</text>
  <text x="298" y="324" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">DC     D9</text>
  <text x="298" y="344" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">MOSI   D11</text>
  <text x="298" y="364" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">SCK    D13</text>
  <text x="298" y="392" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">T_CS   D7</text>
  <text x="298" y="412" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">T_DIN  D11</text>
  <text x="298" y="432" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">T_CLK  D13</text>
  <text x="298" y="452" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">T_DO   D12</text>

  <rect x="540" y="190" width="210" height="230" rx="8" fill="#d9e4f2" stroke="#1d4e89" stroke-width="2"/>
  <text x="558" y="220" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1915">Arduino Nano</text>
  <text x="558" y="244" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5c564c">clone, USB up</text>
  <text x="558" y="276" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D2 D3  bottom</text>
  <text x="558" y="296" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D4 D5  top</text>
  <text x="558" y="324" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D7     touch CS</text>
  <text x="558" y="352" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">5V   TFT VCC</text>
  <text x="558" y="372" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">3V3  TFT LED</text>
  <text x="558" y="392" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">GND  common</text>

  <rect x="40" y="180" width="180" height="200" rx="14" fill="#d7f3f6" stroke="#0e7490" stroke-width="2"/>
  <text x="58" y="210" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1915">2  Bottom player</text>
  <text x="58" y="232" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#0e7490">cyan paddle</text>
  <rect x="70" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#0e7490"/>
  <rect x="140" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#0e7490"/>
  <text x="82" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Left</text>
  <text x="148" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Right</text>
  <text x="58" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D2</text>
  <text x="148" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D3</text>
  <text x="58" y="352" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c564c">Both buttons to GND</text>

  <rect x="820" y="180" width="180" height="200" rx="14" fill="#fff1d6" stroke="#b45309" stroke-width="2"/>
  <text x="838" y="210" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1915">3  Top player</text>
  <text x="838" y="232" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#b45309">amber paddle</text>
  <rect x="850" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#b45309"/>
  <rect x="920" y="258" width="50" height="36" rx="6" fill="#fff" stroke="#b45309"/>
  <text x="862" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Left</text>
  <text x="928" y="281" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1915">Right</text>
  <text x="838" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D4</text>
  <text x="928" y="322" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">D5</text>
  <text x="838" y="352" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c564c">Both buttons to GND</text>

  <path d="M220 300 H250" stroke="#0e7490" stroke-width="3" fill="none"/>
  <path d="M790 300 H820" stroke="#b45309" stroke-width="3" fill="none"/>

  <rect x="40" y="530" width="960" height="190" rx="14" fill="#fff" stroke="#d6d0c6"/>
  <text x="64" y="562" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#1c1915">4  Two resistors drop 5 V to 3.3 V</text>
  <text x="64" y="592" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">Nano ----[ 470 ohm ]----+---- TFT pin</text>
  <text x="268" y="616" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">|</text>
  <text x="268" y="640" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">[ 1k ohm ]</text>
  <text x="268" y="664" font-family="ui-monospace, monospace" font-size="14" fill="#1c1915">GND</text>
  <text x="520" y="592" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">VCC stays on 5V. LED stays on 3V3.</text>
  <text x="520" y="616" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">MOSI's divider also feeds T_DIN. SCK's divider also feeds T_CLK.</text>
  <text x="520" y="640" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">T_DO goes straight to D12. Leave T_IRQ and the panel SDO empty.</text>
  <text x="520" y="664" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">Do not tie T_CS to 3V3. The sketch drives it from D7.</text>
  <text x="520" y="692" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c564c">Tap the glass to serve, pause, and resume.</text>
</svg>
